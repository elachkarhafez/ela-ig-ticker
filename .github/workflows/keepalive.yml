# GitHub pauses scheduled workflows in public repos after 60 days without commits; this keeps the ticker alive.
name: keepalive
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "ela-ticker"
          git config user.email "ela-ticker@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "heartbeat" || exit 0
          git push
